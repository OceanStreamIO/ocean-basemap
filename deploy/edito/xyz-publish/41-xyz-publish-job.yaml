# =============================================================================
# Publish the flat {z}/{x}/{y} tile tree from rendered shards
# =============================================================================
# One process sending tiles tops out near 400 PUT/s however many threads it is
# given -- measured, and 128 threads are slower than 64. The wall is the
# interpreter. Eight processes reach about 1,930/s, which is a fifteen-hour
# publish in about three.
#
# Eight processes need about five and a half cores, so this is sized at six.
# That is deliberately within one ordinary node: a wider pod would need the
# GPU-node scheduling trick, and this job has no reason to compete for those.
#
# Indexed with a single completion. Nothing needs more than one pod today, but
# shards are assigned by completion index, so raising completions and
# parallelism together is the only change needed to fan out -- and the endpoint,
# not this pod, is what should decide whether that is wise.
apiVersion: batch/v1
kind: Job
metadata:
  name: basemap-xyz-publish
  namespace: project-oceanstream
  labels:
    app: basemap-xyz-publish
spec:
  completionMode: Indexed
  completions: __PODS__
  parallelism: __PODS__
  # Resume is per column in the marks volume, so a retry costs only the column
  # in flight. It is not zero because a three-hour job should survive one
  # transient failure.
  # Not 2. A publish of this length spans credential rotations, and although
  # the sender now recovers from one in place, anything else that kills a pod
  # should cost the column in flight rather than the run. Resume is per column
  # on the volume, so a retry is cheap and idempotent.
  backoffLimit: 20
  # 30 h. Twelve was right for the z12 tree and wrong for this one: the deadline
  # has to be read against the object count, and z13 quadrupled it. 89,478,485
  # objects at the measured 2,030/s is 12.2 h of sending alone, so a 12 h
  # deadline killed a run that was 81 % done and had nothing wrong with it.
  # Generous is safe here -- the marks volume means a fresh Job resumes rather
  # than restarts, so the deadline is a backstop, not a budget.
  activeDeadlineSeconds: 108000
  ttlSecondsAfterFinished: 86400   # the namespace is shared
  template:
    metadata:
      labels:
        app: basemap-xyz-publish
      annotations:
        # Holds a RWO volume and runs for hours; it must not be consolidated
        # away mid-run.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: publish
          # uv + Python, pinned by digest. The publisher needs boto3 and
          # sqlite3 and nothing that links a system library, but the image is
          # shared with the render Job so the digest stays the same.
          image: ghcr.io/astral-sh/uv:python3.13-bookworm@sha256:47965cdc9d53a515f68f78241161c901e70051ce428f12e791bd7fe19f6a631a
          command: ["bash", "/opt/publish/job.sh"]
          env:
            - name: CODE_REV
              value: "__CODE_REV__"
            - name: RUN_ID
              value: "__RUN_ID__"
            # Where the tree is written. A version, not the live prefix: the
            # send takes hours, so writing in place leaves the public map half
            # old and half new with a seam moving across it. The CDN is pointed
            # at the finished version afterwards, which is one deployment.
            - name: BASEMAP_XYZ_VERSION
              value: "__XYZ_VERSION__"
            - name: BASEMAP_XYZ_PUBLISH_PROCESSES
              value: "8"
            - name: BASEMAP_XYZ_PUBLISH_WORKERS
              value: "64"
            - name: BASEMAP_S3_ENDPOINT
              value: https://s3.waw3-1.cloudferro.com
            - name: BASEMAP_S3_BUCKET
              value: oceanstream-bucket
            - name: BASEMAP_S3_REGION
              value: waw3-1
            - name: AWS_DEFAULT_REGION
              value: waw3-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            # Mounted as files below as well as injected here, and the files
            # are what a long run actually uses. These are frozen when the
            # container starts; the platform rotates this Secret, and a publish
            # that runs for twelve hours will be holding a revoked key by the
            # end of it -- measured, twice, at three hours and at twenty-five
            # minutes. A mounted Secret is updated in place by the kubelet.
            # The pod count, which job.sh needs to work out which shards are
            # this pod's. completions/parallelism alone do not tell it: every
            # pod read the default of one, decided it owned the whole set, and
            # all four published all sixteen shards. Invisible until now,
            # because this shipped at one pod.
            - name: PUBLISH_PODS
              value: "__PODS__"
            - name: BASEMAP_S3_CREDENTIALS_DIR
              value: /etc/s3
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: jupyter-python-568282-secrets3, key: AWS_ACCESS_KEY_ID}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: jupyter-python-568282-secrets3, key: AWS_SECRET_ACCESS_KEY}
          resources:
            requests:
              cpu: "6"
              memory: 4Gi
              # One shard at a time on local disk, plus the uv cache and the
              # virtual environment, which share the same volume. Size this
              # against the shard, not against the tree: at z13 a shard was
              # 8 GB and 12Gi was comfortable; at z14 it is 21.4 GB, and a pod
              # that passes its ephemeral-storage limit is evicted rather than
              # killed -- which takes its siblings on that node with it.
              ephemeral-storage: 24Gi
            limits:
              cpu: "7"
              memory: 8Gi
              ephemeral-storage: 44Gi
          volumeMounts:
            - name: s3
              mountPath: /etc/s3
              readOnly: true
            - name: marks
              mountPath: /marks
            - name: work
              mountPath: /work
            - name: script
              mountPath: /opt/publish
      volumes:
        - name: s3
          secret:
            secretName: jupyter-python-568282-secrets3
            items:
              - {key: AWS_ACCESS_KEY_ID, path: AWS_ACCESS_KEY_ID}
              - {key: AWS_SECRET_ACCESS_KEY, path: AWS_SECRET_ACCESS_KEY}
        - name: marks
          # Per pod, not shared. The marks were on a ReadWriteOnce PVC, and
          # there is no ReadWriteMany storage class here, so the second pod
          # failed to mount it and the third and fourth never scheduled. Each
          # pod owns a disjoint set of shards, so its marks are its own anyway;
          # what makes a restart cheap across pods is the .published marker each
          # finished shard leaves in object storage, which costs at most the
          # shard in flight.
          emptyDir:
            sizeLimit: 2Gi
        - name: work
          emptyDir:
            # 21.4 GB for a z14 shard, about 1.5 for the cache and the venv, and
            # room for one to arrive while the last is still being deleted.
            sizeLimit: 40Gi
        - name: script
          configMap:
            name: basemap-xyz-publish-script
