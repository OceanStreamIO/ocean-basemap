# The raster relief build (bathymetry + land relief), on a GPU node for its
# 16 CPUs -- with no GPU requested, so it costs no GPU quota. Same scheduling
# pattern as the denoise-lab worker: the GPU taint toleration plus affinity on
# nvidia.com/gpu.product.
#
# CPU-bound, but memory is sized for the HR pass: a worker levels off at about
# 3.5 GiB there (measured), so 14 workers need ~49 GiB. A GPU node has 110 GiB,
# and the anti-affinity below keeps the Job off denoise-lab's node.
#
# Applied by run.sh, which fills in CODE_REV and replaces any previous run
# (a Job's pod template is immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: basemap-build
  namespace: project-oceanstream
  labels:
    app: basemap-build
spec:
  # Every step resumes from the volume, so a retry costs only the work in
  # flight. It is not 0 because the first full run was killed by the cluster
  # autoscaler scaling its node away, and a run that long should survive one.
  backoffLimit: 2
  # Longer than the run, with room. The flat tree alone is fifteen hours and
  # now carries contours, lakes and rivers; at the old 12 h the job would have
  # been killed partway through it.
  activeDeadlineSeconds: 172800   # 48 h
  ttlSecondsAfterFinished: 86400  # the namespace is shared: clean up after a day
  template:
    metadata:
      labels:
        app: basemap-build
      annotations:
        # The autoscaler removed the node under the first full run twenty
        # minutes in: "deleting pod for node scale down". This job holds a
        # RWO Cinder volume and runs for most of a day, so it must not be a
        # candidate for consolidation.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # A second run would otherwise chown ~200 GB before starting.
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
        - key: node.cloudferro.com/type
          operator: Equal
          value: gpu
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: Exists
        podAntiAffinity:
          # Stay off the node denoise-lab's worker is using if another is free.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: denoise-lab
      containers:
        - name: build
          # uv + Python 3.13, pinned by digest. rasterio, fiona and Pillow wheels
          # bundle their own GDAL (with netCDF), so no GDAL image is needed --
          # but they still link the system libexpat and zlib, which the -slim
          # variant leaves out. Hence full bookworm.
          image: ghcr.io/astral-sh/uv:python3.13-bookworm@sha256:47965cdc9d53a515f68f78241161c901e70051ce428f12e791bd7fe19f6a631a
          command: ["bash", "/opt/build/job.sh"]
          env:
            - name: CODE_REV
              value: "__CODE_REV__"
            # The Job's own id, which is stable across its retries and different
            # for every new Job. That is what the REBUILD marker keys on: keyed
            # on the code revision instead, a second run at the same revision --
            # a candidate palette, say -- found the marker, skipped the clear,
            # and republished the previous run's archives in ninety seconds.
            - name: JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['controller-uid']
            - name: REBUILD
              value: "__REBUILD__"
            - name: BASEMAP_XYZ_REDO_FROM
              value: "__XYZ_REDO_FROM__"
            # Which sea ramp to render with, and which archives to render.
            # A candidate palette is judged on a whole map, so it needs its own
            # archives; empty values mean the published ramp and all archives.
            - name: BASEMAP_WATER_RAMP
              value: "__WATER_RAMP__"
            - name: BASEMAP_WATER_THRESHOLD
              value: "__WATER_THRESHOLD__"
            - name: BASEMAP_LAND_STYLE
              value: "__LAND_STYLE__"
            - name: BASEMAP_RENDER_BBOX
              value: "__RENDER_BBOX__"
            - name: BASEMAP_COASTAL_WATER_MAX_ZOOM
              value: "__COASTAL_WATER_MAX_ZOOM__"
            - name: BASEMAP_LAND_ARCHIVES
              value: "__LAND_ARCHIVES__"
            - name: BASEMAP_LAKE_ARCHIVES
              value: "__LAKE_ARCHIVES__"
            - name: BASEMAP_BATHY_ARCHIVES
              value: "__BATHY_ARCHIVES__"
            - name: BUILD_STEPS
              value: "__STEPS__"
            - name: BASEMAP_XYZ_VERSION
              value: "__XYZ_VERSION__"
            # Past z12 only where the HR archive has tiles; empty leaves the
            # tree at z12. See DETAIL_ARCHIVE in pipeline/xyz.py.
            - name: BASEMAP_XYZ_DETAIL_MAX_ZOOM
              value: "__XYZ_DETAIL_MAX_ZOOM__"
            # One sending process is GIL-bound at about 400 objects a second,
            # which is most of a day for the flat tree. Eight reach ~1,930 and
            # need about five and a half cores, which this Job has spare once
            # the render is finished.
            - name: BASEMAP_XYZ_PUBLISH_PROCESSES
              value: "__PUBLISH_PROCESSES__"
            - name: BASEMAP_RENDER_WORKERS
              value: "14"
            - name: GDAL_CACHEMAX
              value: "512"
            # BlueTopo is read over /vsicurl from AWS open data. Without this
            # GDAL lists the whole prefix on every open, which over 6,000 tiles
            # is most of the time spent.
            - name: GDAL_DISABLE_READDIR_ON_OPEN
              value: "EMPTY_DIR"
            - name: CPL_VSIL_CURL_ALLOWED_EXTENSIONS
              value: ".tiff,.tif,.gpkg,.xml"
            - name: BASEMAP_BLUETOPO_REGION
              value: "__BLUETOPO_REGION__"
            # GMRT boxes to stage, by name (pipeline/gmrt.py); unset stages none.
            - name: BASEMAP_GMRT_REGIONS
              value: "__GMRT_REGIONS__"
            # National compilations outside Europe, opt-in by name: see
            # pipeline/cudem.py and pipeline/ausbathytopo.py.
            - name: BASEMAP_CUDEM_REGIONS
              value: "__CUDEM_REGIONS__"
            - name: BASEMAP_AUSBATHYTOPO
              value: "__AUSBATHYTOPO__"
            - name: BASEMAP_S3_ENDPOINT
              value: https://s3.waw3-1.cloudferro.com
            - name: BASEMAP_S3_BUCKET
              value: oceanstream-bucket
            - name: BASEMAP_S3_REGION
              value: waw3-1
            - name: AWS_DEFAULT_REGION
              value: waw3-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: jupyter-python-568282-secrets3, key: AWS_ACCESS_KEY_ID}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: jupyter-python-568282-secrets3, key: AWS_SECRET_ACCESS_KEY}
          resources:
            requests:
              cpu: "12"
              memory: 52Gi
              ephemeral-storage: 5Gi
            limits:
              cpu: "16"
              memory: 72Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            # The Jupyter pod's path, so absolute paths in the mosaics resolve.
            - name: data
              mountPath: /home/onyxia/work/basemap-data
            - name: script
              mountPath: /opt/build
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: basemap-build
        - name: script
          configMap:
            name: basemap-build-script
