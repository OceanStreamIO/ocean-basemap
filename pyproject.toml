[project]
name = "basemap"
version = "0.1.0"
description = "GEBCO-based ocean basemap pipeline for the OceanStream web app"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrei Rusu", email = "andrei.rusu@beatfactor.net" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "rasterio>=1.3",
    "fiona>=1.9",
    "shapely>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
    "pmtiles>=3.7",
    # The xyz step reads depth_contours.pmtiles as geometry, to bake the
    # contour lines into the flat tiles at each zoom's own scale.
    "mapbox-vector-tile>=2.1",
    "boto3>=1.43.100",
    "botocore>=1.43.100",
]

[project.scripts]
oceanbase = "basemap.cli:app"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.4",
    "mkdocs-mermaid2-plugin>=1.0",
    # scripts/export-style.py, which publish-viewer.sh runs from .venv. Pinned to
    # the release whose Chromium build is the one installed under
    # PLAYWRIGHT_BROWSERS_PATH on the workspace (chromium-1248).
    "playwright==1.64.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires GDAL and tippecanoe installed",
]

[tool.uv_build]
module-name = "basemap"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
