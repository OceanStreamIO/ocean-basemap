<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OceanStream Basemap — Test Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- MapLibre GL JS -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

<!-- PMTiles protocol adapter -->
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>

<!-- Tile origin overrides; must load before app.js -->
<script src="static/config.js?v=39"></script>

<!-- App styles + script -->
<link  href="static/style.css?v=39" rel="stylesheet" />
</head>
<body>

<!-- ───── Map container ───── -->
<div id="map"></div>

<!-- ───── Layer panel (left sidebar) ───── -->
<div id="layer-panel" class="panel">
  <div class="panel-header">
    <h3>Layers</h3>
    <button id="panel-collapse" class="icon-btn" title="Collapse panel (L)">◀</button>
  </div>
  <div id="layer-list" class="panel-body">
    <!-- populated by app.js -->
  </div>
</div>

<!-- ───── Depth legend (bottom-right) ───── -->
<div id="depth-legend" class="legend">
  <div class="legend-title">Depth (m)</div>
  <div class="legend-bar-wrap">
    <canvas id="legend-canvas" width="24" height="240"></canvas>
    <div id="legend-ticks" class="legend-ticks">
      <!-- populated by app.js -->
    </div>
  </div>
</div>

<!-- ───── Coordinate & zoom bar (bottom-left) ───── -->
<div id="info-bar" class="info-bar">
  <span id="zoom-display" title="Current zoom level">z2.5</span>
  <span class="sep">|</span>
  <span id="scale-display" title="Map scale">1:50,000,000</span>
  <span class="sep">|</span>
  <span id="coord-display" title="Cursor position">—</span>
  <button id="coord-fmt-btn" class="icon-btn small" title="Toggle DD / DMS">DD</button>
  <span class="sep">|</span>
  <!-- This map is Web Mercator, which has no poles. The globe draws the
       geographic archives, where Antarctica and the Arctic basin are whole. -->
  <a id="globe-link" href="static/globe.html" title="3D globe, with the poles">Globe</a>
</div>

<!-- ───── Measurement toolbar (top-right, below nav control) ───── -->
<div id="measure-toolbar" class="toolbar">
  <button id="btn-measure-dist" class="tool-btn" title="Measure distance (nautical miles)">
    <svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 16L8 4l4 8 4-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Distance</span>
  </button>
  <button id="btn-measure-area" class="tool-btn" title="Measure area (km²)">
    <svg width="18" height="18" viewBox="0 0 18 18"><polygon points="3,14 9,2 15,14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Area</span>
  </button>
  <button id="btn-measure-clear" class="tool-btn" title="Clear measurements">
    <svg width="18" height="18" viewBox="0 0 18 18"><line x1="4" y1="4" x2="14" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="14" y1="4" x2="4" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Clear</span>
  </button>
</div>

<!-- ───── Measurement readout (floating) ───── -->
<div id="measure-readout" class="readout hidden"></div>

<script src="static/app.js?v=39"></script>
</body>
</html>
