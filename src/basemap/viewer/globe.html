<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OceanStream Basemap — Globe</title>
<!--
  The 2D viewer is Web Mercator, which stops at 85.05 degrees and so has no
  South Pole, no North Pole and no centre of the Arctic basin. This page draws
  the geographic archives instead (`oceanbase run globe`), on a globe that has
  no such limit. Same renderer, same ramps, same ice; a different tile grid.

  Cesium and pmtiles are loaded from a CDN through an import map, so this page
  is as static as the other one -- nothing is bundled and nothing is served but
  these files.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css" />
<style>
  :root { color-scheme: dark; }
  html, body, #globe { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #05080d; font: 13px/1.5 system-ui, sans-serif; color: #dfe6ee; }
  #status {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    background: rgba(8, 12, 18, 0.82); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px; padding: 8px 12px; max-width: min(420px, calc(100vw - 24px));
  }
  #status b { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
  a { color: #7fc4ff; }
</style>
</head>
<body>
<div id="globe"></div>
<div id="status"><b>Loading</b><br />Opening the geographic archives…</div>

<script>
  // Cesium fetches its workers and assets relative to this.
  window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/';
</script>
<script type="importmap">
{
  "imports": {
    "cesium": "https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/index.js",
    "pmtiles": "https://cdn.jsdelivr.net/npm/pmtiles@3.2.0/dist/index.js"
  }
}
</script>
<script type="module">
import { Cartesian3, Color, Viewer } from 'cesium';
import { OceanBasemapProvider } from './cesium-provider.js';

const params = new URLSearchParams(location.search);
const BASE = (params.get('pmtiles') || window.BASEMAP_PMTILES_BASE
  || 'https://oceanstream-bucket.s3.waw3-1.cloudferro.com/basemap/tiles').replace(/\/+$/, '');
const status = document.getElementById('status');

const viewer = new Viewer('globe', {
  baseLayer: false,          // ours are the only imagery layers
  baseLayerPicker: false,
  geocoder: false,
  timeline: false,
  animation: false,
  sceneModePicker: false,
  navigationHelpButton: false,
  infoBox: false,
  selectionIndicator: false,
});
viewer.scene.globe.baseColor = Color.fromCssColorString('#0b1b2b');
// Cesium tints the surface with a ground atmosphere by default, which lays a
// blue wash over everything and puts the ice sheets a long way from the colour
// the renderer gave them. The sky atmosphere stays: it is outside the globe.
viewer.scene.globe.showGroundAtmosphere = false;

// Bottom to top. The geographic pair is the base, because it is the only one
// that reaches the poles, but it stops at z6 and looks soft close up. The
// Mercator archives go over it: they hold the detail, to z15 in European
// waters, everywhere between 85 degrees north and south, and each one declares
// the zooms and the region it covers, so Cesium asks for nothing else.
//
// Within each grid, land goes down first: the sea tiles stop at the coastline
// on their alpha channel, so they compose over the land rather than cover it.
const ARCHIVES = [
  'land_geo', 'bathy_geo',                       // z0-6, poles included
  'land_relief', 'land_relief_eu',               // z0-10 global, z11-12 Europe
  'bathy_global', 'bathy_eu', 'bathy_hr',        // z0-8, z9-11, z12-15
];

try {
  for (const name of ARCHIVES) {
    try {
      const provider = await OceanBasemapProvider.fromUrl(`${BASE}/${name}.pmtiles`);
      viewer.imageryLayers.addImageryProvider(provider);
    } catch (err) {
      // A missing regional archive should cost its own detail, not the globe.
      console.warn(`[globe] ${name} unavailable: ${err.message}`);
    }
  }
  // Looking at the South Pole, which is the point of this page.
  viewer.camera.flyTo({
    destination: Cartesian3.fromDegrees(0, -90, 14_000_000),
    duration: 0,
  });
  status.innerHTML = `<b>OceanStream Basemap</b><br />`
    + `${viewer.imageryLayers.length} archives, poles included, to 15 m in `
    + `European waters.<br />GEBCO · EMODnet · Copernicus · Natural Earth · `
    + `<a href="../index.html">2D viewer</a>`;
} catch (err) {
  status.innerHTML = `<b>Failed</b><br />${err.message}`;
  throw err;
}

window.viewer = viewer;   // for the browser checks
</script>
</body>
</html>
